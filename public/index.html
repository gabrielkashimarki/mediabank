  abrirGuia(b.dataset.slug);
});

// catalogo
let catalogoDados = [];
let filtroEspacoCat = '';
let filtroTipoCat = '';

async function carregarCatalogo() {
  const el = $('#catalogo-conteudo');
  if (!el) return;
  el.textContent = '';
  const carregando = document.createElement('p');
  carregando.className = 'vazio';
  carregando.textContent = 'Carregando catálogo...';
  el.appendChild(carregando);

  try {
    const res = await api('/api/painel/catalogo');
    const dados = await res.json();
    catalogoDados = Array.isArray(dados) ? dados : (dados.catalogo || []);
    const navN = $('#nav-cat-n');
    if (navN) navN.textContent = catalogoDados.length;
    renderizarCatalogo();
  } catch (err) {
    el.textContent = '';
    const erroP = document.createElement('p');
    erroP.className = 'vazio';
    erroP.textContent = 'Não deu para carregar o catálogo. Tente de novo.';
    el.appendChild(erroP);
  }
}

function renderizarCatalogo() {
  const el = $('#catalogo-conteudo');
  if (!el) return;
  el.textContent = '';

  const topoDiv = document.createElement('div');
  topoDiv.className = 'cat-filtros';

  const espacosUnicos = [...new Set(catalogoDados.map(g => g.espaco).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const tiposUnicos = [...new Set(catalogoDados.map(g => g.tipo_evento).filter(Boolean))].sort((a, b) => a.localeCompare(b));

  const lblEspaco = document.createElement('label');
  lblEspaco.textContent = 'Espaço: ';
  lblEspaco.style.cssText = 'font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px';
  const selEspaco = document.createElement('select');
  selEspaco.setAttribute('aria-label', 'Filtrar por espaço');
  const optTodosEsp = document.createElement('option');
  optTodosEsp.value = '';
  optTodosEsp.textContent = 'Todos os espaços';
  selEspaco.appendChild(optTodosEsp);
  for (const esp of espacosUnicos) {
    const opt = document.createElement('option');
    opt.value = esp;
    opt.textContent = esp;
    if (filtroEspacoCat === esp) opt.selected = true;
    selEspaco.appendChild(opt);
  }
  selEspaco.onchange = () => {
    filtroEspacoCat = selEspaco.value;
    renderizarListaCatalogo(listaDiv);
  };
  lblEspaco.appendChild(selEspaco);
  topoDiv.appendChild(lblEspaco);

  const lblTipo = document.createElement('label');
  lblTipo.textContent = 'Tipo de evento: ';
  lblTipo.style.cssText = 'font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px';
  const selTipo = document.createElement('select');
  selTipo.setAttribute('aria-label', 'Filtrar por tipo de evento');
  const optTodosTipos = document.createElement('option');
  optTodosTipos.value = '';
  optTodosTipos.textContent = 'Todos os tipos';
  selTipo.appendChild(optTodosTipos);
  for (const t of tiposUnicos) {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    if (filtroTipoCat === t) opt.selected = true;
    selTipo.appendChild(opt);
  }
  selTipo.onchange = () => {
    filtroTipoCat = selTipo.value;
    renderizarListaCatalogo(listaDiv);
  };
  lblTipo.appendChild(selTipo);
  topoDiv.appendChild(lblTipo);

  el.appendChild(topoDiv);

  const listaDiv = document.createElement('div');
  listaDiv.className = 'cat-lista';
  el.appendChild(listaDiv);

  renderizarListaCatalogo(listaDiv);
}

function renderizarListaCatalogo(listaDiv) {
  listaDiv.textContent = '';

  const filtrados = catalogoDados.filter(g => {
    if (filtroEspacoCat && g.espaco !== filtroEspacoCat) return false;
    if (filtroTipoCat && g.tipo_evento !== filtroTipoCat) return false;
    return true;
  });

  if (!filtrados.length) {
    const pVazio = document.createElement('p');
    pVazio.className = 'vazio';
    pVazio.textContent = catalogoDados.length
      ? 'Nenhum grupo encontrado com esses filtros.'
      : 'Nenhum catálogo gerado ainda. Aguarde o próximo ciclo do agendador.';
    listaDiv.appendChild(pVazio);
    return;
  }

  for (const g of filtrados) {
    const card = document.createElement('article');
    card.className = 'cat-card';

    const topo = document.createElement('div');
    topo.className = 'cat-topo';

    const tit = document.createElement('h2');
    tit.className = 'cat-tit';
    tit.textContent = `${g.espaco || 'Sem espaço'} · ${g.tipo_evento || 'Sem tipo'} · ${g.n_fotos} ${g.n_fotos === 1 ? 'foto' : 'fotos'}`;
    topo.appendChild(tit);

    if (usuario && usuario.admin) {
      const btRefazer = document.createElement('button');
      btRefazer.className = 'ic';
      btRefazer.textContent = 'Refazer';
      btRefazer.onclick = async () => {
        btRefazer.disabled = true;
        try {
          const res = await api('/api/painel/catalogo/regerar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ grupo: g.grupo }),
          });
          if (res.ok) {
            btRefazer.textContent = 'Marcado p/ refazer';
          } else {
            const err = await res.json().catch(() => ({}));
            alert(err.erro || 'Erro ao pedir para refazer');
            btRefazer.disabled = false;
          }
        } catch {
          alert('Erro de conexão');
          btRefazer.disabled = false;
        }
      };
      topo.appendChild(btRefazer);
    }
    card.appendChild(topo);

    const conteudo = g.conteudo || {};

    if (conteudo.resumo) {
      const pResumo = document.createElement('p');
      pResumo.className = 'cat-resumo';
      pResumo.textContent = conteudo.resumo;
      card.appendChild(pResumo);

// colecoes
async function carregarColecoes() {
  try {
    const res = await api('/api/painel/colecoes');
    const cols = await res.json();
    $('#nav-col-n').textContent = cols.length;
    const el = $('#colecoes-conteudo');
    el.textContent = '';

    const topoDiv = document.createElement('div');
    topoDiv.style.cssText = 'padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px';
    const buscaDiv = document.createElement('div');
    buscaDiv.className = 'busca';
    buscaDiv.style.cssText = 'max-width:360px;height:34px;padding:0 12px';
    const buscaInput = document.createElement('input');
    buscaInput.type = 'search';
    buscaInput.id = 'busca-colecoes';
    buscaInput.placeholder = 'Filtrar por nome...';
    buscaInput.setAttribute('aria-label', 'Filtrar coleções');
    buscaDiv.appendChild(buscaInput);
    topoDiv.appendChild(buscaDiv);
    el.appendChild(topoDiv);

    const listaDiv = document.createElement('div');
    listaDiv.className = 'col-lista';
    el.appendChild(listaDiv);

    function renderizar(termo = '') {
      listaDiv.textContent = '';
      const filtradas = cols.filter(c => (c.nome || '').toLowerCase().includes(termo.toLowerCase().trim()));
      if (!filtradas.length) {
        const p = document.createElement('p');
        p.className = 'vazio';
        p.textContent = cols.length ? 'Nenhuma coleção encontrada para a busca.' : 'Nenhuma coleção ainda.';
        listaDiv.appendChild(p);
        return;
      }
      for (const c of filtradas) {
        const card = document.createElement('button');
        card.className = 'col-card';
        card.dataset.cid = c.id;

        if (c.capa) {
          const img = document.createElement('img');
          img.src = `/api/painel/midia/thumb/${encodeURIComponent(c.capa)}.jpg`;
          img.alt = '';
          card.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.style.cssText = 'background:var(--sunk);min-height:80px';
          card.appendChild(ph);
        }

        const info = document.createElement('div');
        info.className = 'info';

        const h3 = document.createElement('h3');
        h3.textContent = c.nome;
        info.appendChild(h3);

        const small = document.createElement('small');
        small.textContent = `${c.n} foto${c.n !== 1 ? 's' : ''}`;
        info.appendChild(small);

        const tagsDiv = document.createElement('div');
        tagsDiv.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';

        if (c.pasta_id) {
          const evTag = document.createElement('span');
          evTag.className = 'evento-tag';
          evTag.textContent = 'Evento';
          tagsDiv.appendChild(evTag);
        }

        if (c.slug_publico) {
          const pubTag = document.createElement('span');
          pubTag.className = 'pub-tag';
          pubTag.textContent = 'publicada';
          tagsDiv.appendChild(pubTag);
        }

        if (tagsDiv.children.length) info.appendChild(tagsDiv);
        card.appendChild(info);
        listaDiv.appendChild(card);
      }
    }

    buscaInput.addEventListener('input', () => renderizar(buscaInput.value));
    renderizar('');

    listaDiv.addEventListener('click', e => {
      const card = e.target.closest('.col-card');
      if (card) abrirColecao(card.dataset.cid);
    });
  } catch {}
}

async function abrirColecao(id) {
  try {
    const res = await api('/api/painel/colecoes/' + id);
    if (!res.ok) return;
    const c = await res.json();
    const el = $('#colecoes-conteudo');
    el.textContent = '';
    const naoVisiveis = c.fotos.filter(f => !f.exposta).length;
    const h = 200;

    const wrap = document.createElement('div');
    wrap.className = 'col-aberta';

    const topoBarra = document.createElement('div');
    const btVoltar = document.createElement('button');
    btVoltar.className = 'ic';
    btVoltar.id = 'col-voltar';
    btVoltar.textContent = '← Voltar';
    btVoltar.onclick = () => carregarColecoes();
    topoBarra.appendChild(btVoltar);
    wrap.appendChild(topoBarra);

    const h2 = document.createElement('h2');
    h2.textContent = c.nome;
    wrap.appendChild(h2);

    if (c.descricao) {
      const pDesc = document.createElement('p');
      pDesc.textContent = c.descricao;
      wrap.appendChild(pDesc);
    }

    const colLink = document.createElement('div');
    colLink.className = 'col-link';
    if (c.slug_publico) {
      const url = `${location.origin}/c/${c.slug_publico}`;
      const code = document.createElement('code');
      code.id = 'col-url';
      code.textContent = url;
      colLink.appendChild(code);

      const btCopiar = document.createElement('button');
      btCopiar.className = 'ic';
      btCopiar.id = 'col-copiar';
      btCopiar.textContent = 'Copiar';
      btCopiar.onclick = async () => {
        try { await navigator.clipboard.writeText(url); btCopiar.textContent = 'Copiado'; }
        catch { getSelection().selectAllChildren(code); }
      };
      colLink.appendChild(btCopiar);

      const btDespub = document.createElement('button');
      btDespub.className = 'ic';
      btDespub.id = 'col-despub';
      btDespub.textContent = 'Despublicar';
      btDespub.onclick = async () => {
        await api('/api/painel/colecoes/' + id + '/publicar', { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
        abrirColecao(id);
      };
      colLink.appendChild(btDespub);
    } else {
      const btPub = document.createElement('button');
      btPub.className = 'ic pri';
      btPub.id = 'col-pub';
      btPub.textContent = 'Publicar link';
      btPub.onclick = async () => {
        await api('/api/painel/colecoes/' + id + '/publicar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        abrirColecao(id);
      };
      colLink.appendChild(btPub);
    }

    const btZip = document.createElement('a');
    btZip.className = 'ic';
    btZip.id = 'col-zip';
    btZip.href = `/api/painel/colecoes/${encodeURIComponent(id)}/originais.zip`;
    btZip.textContent = 'Baixar originais (.zip)';
    colLink.appendChild(btZip);

    wrap.appendChild(colLink);

    if (naoVisiveis) {
      const aviso = document.createElement('div');
      aviso.className = 'col-aviso';
      aviso.textContent = `${naoVisiveis} foto${naoVisiveis > 1 ? 's' : ''} não aparece${naoVisiveis > 1 ? 'm' : ''} para o cliente`;
      wrap.appendChild(aviso);
    }

    const grade = document.createElement('div');
    grade.className = 'grade';
    grade.id = 'grade-col';

    for (const f of c.fotos) {
      const ar = (f.largura && f.altura) ? f.largura / f.altura : 1;
      const it = document.createElement('div');
      it.className = 'it col-foto';
      it.dataset.id = f.id;
      it.style.flex = `${ar} 1 ${Math.round(ar * (innerWidth < 600 ? h * .6 : h))}px`;
      it.style.aspectRatio = `${f.largura || 1}/${f.altura || 1}`;

      const img = document.createElement('img');
      img.src = f.thumb_url;
      img.alt = f.alt || f.titulo || '';
      img.loading = 'lazy';
      it.appendChild(img);

      if (!f.exposta) {
        const lock = document.createElement('span');
        lock.className = 'lock';
        lock.title = 'Só uso interno';
        lock.innerHTML = lockSvg;
        it.appendChild(lock);
      }

      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.setAttribute('aria-label', 'Remover');
      rm.dataset.rm = f.id;
      rm.textContent = '✕';
      it.appendChild(rm);

      grade.appendChild(it);
    }

    grade.addEventListener('click', async e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) {
        await api('/api/painel/colecoes/' + id + '/fotos/' + rm.dataset.rm, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
        abrirColecao(id);
        return;
      }
      const it = e.target.closest('.it');
      if (it) abrirVisor(it.dataset.id);
    });

    wrap.appendChild(grade);

    const acoesFim = document.createElement('div');
    acoesFim.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';

    const btExcluir = document.createElement('button');
    btExcluir.className = 'ic';
    btExcluir.id = 'col-excluir';
    btExcluir.style.color = 'var(--bad)';
    btExcluir.textContent = 'Excluir coleção';
    btExcluir.onclick = async () => {
      if (!confirm('Excluir esta coleção?')) return;
      await api('/api/painel/colecoes/' + id, { method: 'DELETE', headers: { 'Content-Type': 'application/json' } });
      carregarColecoes();
    };
    acoesFim.appendChild(btExcluir);

    if (c.pasta_id) {
      const btNaoEvento = document.createElement('button');
      btNaoEvento.className = 'ic';
      btNaoEvento.id = 'col-nao-evento';
      btNaoEvento.style.color = 'var(--bad)';
      btNaoEvento.textContent = 'Não é evento';
      btNaoEvento.onclick = async () => {
        if (!confirm('Desmarcar esta pasta como evento? A coleção automática será removida.')) return;
        const resPost = await api('/api/painel/pastas/' + encodeURIComponent(c.pasta_id) + '/evento', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ evento: false }),
        });
        if (resPost.ok) {
          carregarColecoes();
        } else {
          const err = await resPost.json().catch(() => ({}));
          alert(err.erro || 'Erro ao desmarcar evento');
        }
      };
      acoesFim.appendChild(btNaoEvento);
    }

    wrap.appendChild(acoesFim);
    el.appendChild(wrap);
  } catch {}
}

function elementoVisivel(el) {
  if (!el) return false;
  if (el.hidden) return false;
  if (el.closest('[hidden]')) return false;
  const estilo = window.getComputedStyle(el);
  if (estilo.display === 'none' || estilo.visibility === 'hidden' || estilo.opacity === '0') return false;
  const rect = el.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return false;
  if (rect.right <= 0 || rect.bottom <= 0 || rect.left >= window.innerWidth || rect.top >= window.innerHeight) return false;
  return true;
}

function posicionarCartaoTour(alvoEl) {
  if (!tourOverlay || !tourCartao) return;

  const visivel = alvoEl && elementoVisivel(alvoEl);

  if (window.innerWidth < 700) {
    if (visivel) {
      tourOverlay.classList.remove('sem-alvo');
      tourFoco.style.display = 'block';
      const r = alvoEl.getBoundingClientRect();
      const pad = 4;
      tourFoco.style.top = Math.max(0, r.top - pad) + 'px';
      tourFoco.style.left = Math.max(0, r.left - pad) + 'px';
      tourFoco.style.width = (r.width + pad * 2) + 'px';
      tourFoco.style.height = (r.height + pad * 2) + 'px';
    } else {
      tourOverlay.classList.add('sem-alvo');
      tourFoco.style.display = 'none';
    }
    return;
  }

  if (!visivel) {
    tourOverlay.classList.add('sem-alvo');
    tourFoco.style.display = 'none';
    tourCartao.style.top = '50%';
    tourCartao.style.left = '50%';
    tourCartao.style.bottom = 'auto';
    tourCartao.style.right = 'auto';
    tourCartao.style.transform = 'translate(-50%, -50%)';
    return;
  }

  tourOverlay.classList.remove('sem-alvo');
  tourFoco.style.display = 'block';
  tourCartao.style.transform = 'none';

  const r = alvoEl.getBoundingClientRect();
  const pad = 4;
  tourFoco.style.top = Math.max(0, r.top - pad) + 'px';
  tourFoco.style.left = Math.max(0, r.left - pad) + 'px';
  tourFoco.style.width = (r.width + pad * 2) + 'px';
  tourFoco.style.height = (r.height + pad * 2) + 'px';

  const cw = tourCartao.offsetWidth || 360;
  const ch = tourCartao.offsetHeight || 190;
  const gap = 12;
  const margem = 16;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let top, left;

  if (r.right < 320) {
    left = r.right + gap;
    top = r.top + (r.height - ch) / 2;
  } else if (r.top < 120) {
    top = r.bottom + gap;
    left = r.left;
  } else if (alvoEl.id === 'grade') {
    top = r.top + 20;
    left = r.left + 24;
  } else {
    if (r.bottom + gap + ch + margem <= vh) {
      top = r.bottom + gap;
      left = r.left;
    } else if (r.top - gap - ch >= margem) {
      top = r.top - gap - ch;
      left = r.left;
    } else if (r.right + gap + cw + margem <= vw) {
      top = r.top;
      left = r.right + gap;
    } else {
      top = r.top;
      left = r.left - gap - cw;
    }
  }

  left = Math.max(margem, Math.min(left, vw - cw - margem));
  top = Math.max(margem, Math.min(top, vh - ch - margem));

  tourCartao.style.top = top + 'px';
  tourCartao.style.left = left + 'px';
  tourCartao.style.bottom = 'auto';
  tourCartao.style.right = 'auto';
}

function irParaPassoTour(indice) {
  if (indice < 0 || indice >= PASSOS_TOUR.length) return;
  passoAtualTour = indice;
  const passo = PASSOS_TOUR[indice];

  if (passo.aba) {
    trocarAbaTour(passo.aba);
  }

  const btProximo = montarConteudoCartaoTour(passo, indice, PASSOS_TOUR.length);

  let alvoEl = null;
  if (passo.alvo) {
    alvoEl = document.querySelector(passo.alvo);
    if (alvoEl && typeof alvoEl.scrollIntoView === 'function') {
      try { alvoEl.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch {}
    }
  }

  posicionarCartaoTour(alvoEl);

  if (btProximo) {
    try { btProximo.focus(); } catch {}
  }
}

function onTecladoTour(e) {
  if (e.key === 'Escape') {
    e.preventDefault();
    fecharTour(true);
    return;
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (passoAtualTour < PASSOS_TOUR.length - 1) {
      irParaPassoTour(passoAtualTour + 1);
    } else {
      fecharTour(true);
    }
    return;
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (passoAtualTour > 0) {
      irParaPassoTour(passoAtualTour - 1);
    }
    return;
  }
  if (e.key === 'Enter') {
    if (e.target && e.target.classList && e.target.classList.contains('tour-bt-voltar')) {
      return;
    }
    if (e.target && e.target.classList && e.target.classList.contains('tour-bt-pular')) {
      return;
    }
    e.preventDefault();
    if (passoAtualTour < PASSOS_TOUR.length - 1) {
      irParaPassoTour(passoAtualTour + 1);
    } else {
      fecharTour(true);
    }
  }
}

function onRedimensionarTour() {
  if (!tourOverlay || passoAtualTour < 0 || passoAtualTour >= PASSOS_TOUR.length) return;
  const passo = PASSOS_TOUR[passoAtualTour];
  const alvoEl = passo.alvo ? document.querySelector(passo.alvo) : null;
  posicionarCartaoTour(alvoEl);
}

function abrirTour() {
  fecharTour(false);
  passoAtualTour = 0;
  criarElementosTour();
  document.addEventListener('keydown', onTecladoTour);
  window.addEventListener('resize', onRedimensionarTour);
  window.addEventListener('scroll', onRedimensionarTour, true);
  irParaPassoTour(0);
}

function fecharTour(salvar = true) {
  if (salvar && (!usuario || !usuario.onboarding_feito)) {
    if (usuario) usuario.onboarding_feito = true;
    api('/api/painel/onboarding', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    }).catch(() => {});
  }
  trocarAbaTour('galeria');
  document.removeEventListener('keydown', onTecladoTour);
  window.removeEventListener('resize', onRedimensionarTour);
  window.removeEventListener('scroll', onRedimensionarTour, true);
  if (tourOverlay) {
    tourOverlay.remove();
    tourOverlay = null;
    tourFoco = null;
    tourCartao = null;
  }
}

iniciar();
</script>
